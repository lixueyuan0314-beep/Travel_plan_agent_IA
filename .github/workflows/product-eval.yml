name: Product safety evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline scenarios
        run: python -m eval.product_eval

      - name: Run product unit tests
        run: python -m unittest tests.test_product_layer tests.test_product_eval -v
